name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Build runs in CI because Next's TypeScript integration depends on
      # experimental.useTypeScriptCli under TypeScript 7. Without this step that
      # flag would only ever be exercised on one developer's machine.
      - name: Build
        run: npm run build

      # Public-demo next build + next-start HTTP smoke — bundled fixtures only;
      # no Tiingo, Alpaca, OpenAI, or other credentials required.
      - name: Public demo production smoke
        run: npm run smoke:demo:prod
